services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    env_file:
      - /run/base44/app.env
    environment:
      - VITE_BASE44_APP_ID=${VITE_BASE44_APP_ID:-}
      - VITE_BASE44_APP_BASE_URL=${VITE_BASE44_APP_BASE_URL:-}
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"

volumes:
  node_modules:
